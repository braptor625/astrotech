<title>AstroTech</title>
<meta name="description" content="AstroTech: a pixel-art incremental game about a mining company that consumes the universe.">
<style>/*STYLE*/</style>
<div id="app">
  <header class="topbar panel">
    <div class="brand"><img id="brand-ico" class="ico xl pixel" alt=""><div><h1>ASTROTECH</h1><span>MINING CO. · EST. 2187</span></div></div>
    <div class="chips">
      <div class="chip slot money" data-tip="money"><img class="ico pixel" data-ico="money" alt=""><b id="st-money">$0</b><span class="sub" id="st-income"></span></div>
      <div class="chip slot eq" id="chip-eq" data-tip="equity" hidden><img class="ico pixel" data-ico="company" alt=""><b id="st-equity"></b></div>
      <div class="chip slot rp" id="chip-rp" data-tip="rp" hidden><img class="ico pixel" data-ico="rp" alt=""><b id="st-rp"></b></div>
      <div class="chip slot rep" id="chip-rep" data-tip="rep" hidden><img class="ico pixel" data-ico="contract" alt=""><b id="st-rep"></b></div>
      <div id="st-layers" style="display:contents"></div>
      <span class="challenge-tag" id="challenge-tag" hidden></span>
      <span class="demo-tag" id="demo-tag" hidden>DEMO</span>
    </div>
    <button class="btn gold dir-pill" id="directive" data-act="tab" data-arg="archive"></button>
    <div class="topbtns">
      <button class="btn" id="btn-act" data-act="activity" data-tip="txt:Activity log (A)" aria-label="Activity log" aria-keyshortcuts="A"><img class="ico pixel" data-ico="scroll" alt=""><span class="nbadge" id="act-badge" hidden></span></button>
      <button class="btn" id="btn-sound" data-act="sound-top" data-tip="txt:Sound on or off" aria-label="Toggle sound"></button>
      <button class="btn" id="btn-settings" data-act="settings" data-tip="txt:Settings: display, accessibility, saving" aria-label="Settings"><img class="ico pixel" data-ico="stats" alt=""></button>
    </div>
  </header>
  <nav class="rail panel" id="tabs" aria-label="Consoles"></nav>
  <main class="console panel">
    <div class="tabbody" id="tabbody"></div>
  </main>
  <aside class="monitor" id="monitor" aria-label="Monitor">
    <div class="viewport panel">
      <div class="vbar" id="vbar">
        <div class="segctl" role="group" aria-label="Viewport view">
          <button class="btn tiny on" data-act="view" data-arg="map" aria-keyshortcuts="[ ]">MAP</button>
          <button class="btn tiny" data-act="view" data-arg="launch">LAUNCH</button>
          <button class="btn tiny" data-act="view" data-arg="target">CLOSE-UP</button>
        </div>
        <span class="vregs" id="vregs"></span>
      </div>
      <div class="scene-wrap scan">
        <canvas id="scene" aria-label="Main viewport. On the system map, click a target to plan a mission."></canvas>
        <div id="cardbox" hidden></div>
        <div class="strike-banner" id="strike" hidden>CREW ON STRIKE</div>
        <div class="ticker" id="ticker" aria-live="polite" aria-relevant="additions"></div>
      </div>
    </div>
    <div id="deck"></div>
    <section class="drawer" id="drawer" aria-label="Activity" inert><div class="dr-in panel">
      <div class="dr-head">
        <h3>ACTIVITY</h3>
        <button class="btn tiny ghost" data-act="activity" aria-label="Close activity">CLOSE</button>
      </div>
      <div class="segctl dr-filters" role="group" aria-label="Filter activity">
        <button class="btn tiny on" data-act="actfilter" data-arg="all">ALL</button>
        <button class="btn tiny" data-act="actfilter" data-arg="missions">MISSIONS</button>
        <button class="btn tiny" data-act="actfilter" data-arg="money">MONEY</button>
        <button class="btn tiny" data-act="actfilter" data-arg="story">STORY</button>
        <button class="btn tiny" data-act="actfilter" data-arg="alerts">ALERTS</button>
      </div>
      <div class="dr-log" id="lowbody" aria-live="polite" aria-relevant="additions"></div>
    </div></section>
  </aside>
</div>
<div id="tooltip" hidden></div>
<div id="toasts"></div>
<div id="modal" hidden></div>
<script>/*SCRIPTS*/</script>
<script>
(function () {
  function start(data) { AT.ui.start(data || {}); }
  var hot = window.claude && window.claude.hot;
  function go() { if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {}); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
})();
</script>
